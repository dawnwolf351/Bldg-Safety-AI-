name: capstone_project_ui
description: "딥러닝 기반 실시간 건축물 구조 안전 진단 커스텀 Flutter 프로젝트"
# 버전을 명시하여 추후 배포/관리에 사용합니다.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # 상태관리를 위한 Provider (MVVM 패턴의 핵심)
  provider: ^6.1.2
  
  # 네트워크 API 통신을 위한 Dio (REST API 호출)
  dio: ^5.4.3
  
  # 안전한 로그인 토큰 저장을 위한 Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # 다른 컴퓨터(Flask 서버)와 통신하기 위한 소켓 라이브러리
  socket_io_client: ^3.1.4
  
  # PDF 보고서 생성 및 미리보기/저장
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.5
  
  # 날짜 포맷팅
  intl: ^0.19.0
  # 실시간 RTSP 스트리밍용 (media_kit — iOS 26+ 호환)
  media_kit: ^1.2.6                    # 핵심 플레이어 엔진
  media_kit_video: ^1.3.1              # 비디오 위젯 (화면 렌더링)
  media_kit_libs_video: ^1.0.7         # iOS/Android 네이티브 라이브러리
  
  # 구글 지도 및 지오코딩 (위경도 변환)
  google_maps_flutter: ^2.5.3
  geocoding: ^3.0.0
  audioplayers: ^6.6.0
  # 갤러리/카메라에서 이미지 선택 (결함 이미지 업로드용)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
